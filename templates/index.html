<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Hangover Calculator</title>
</head>
<body>
    <h1>Hangover Calculator!</h1>

    <form action="/result" method="post">
        <label>Beers</label>
        <input type="number" name="beers" min="0" value="0">
        <label>Shots</label>
        <input type="number" name="shots" min="0" value="0">
        <label>Cocktails</label>
        <input type="number" name="cocktails" min="0" value="0">
        <label>Wines</label>
        <input type="number" name="wines" min="0" value="0">
        <button type="submit">Calculate</button>
    </form>
<footer>For fun only, not medical advice.</footer>
</body>
</html>
